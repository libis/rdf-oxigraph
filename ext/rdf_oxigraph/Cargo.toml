[package]
name = "rdf_oxigraph"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = "0.7"
# default-features = false drops the `rocksdb` feature (oxrocksdb-sys, a heavy C++
# dependency). We only use the in-memory `Store::new()`, never the on-disk
# `Store::open()`, so this is no functional loss — and it makes cross-compiling
# precompiled gems (esp. Linux x86_64/arm64, incl. musl) reliable and the gems
# much smaller. Re-enable `rocksdb` here if on-disk persistence is ever needed.
oxigraph = { version = "0.4", default-features = false }

# NOTE: in-process SHACL via the rudof `shacl_validation` crate was attempted but
# deferred — shacl_validation 0.2.12 is not cleanly buildable from crates.io (its
# transitive deps mix the pre/post-rename `iri_s`/`rudof_iri` crates, an upstream
# semver inconsistency). SHACL stays external for now (see README). Revisit when
# rudof publishes a coherent release.
