[package]
name = "rdf_oxigraph"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = "0.7"
# default-features = false drops the `rocksdb` feature (oxrocksdb-sys, a heavy C++
# dependency). We only use the in-memory `Store::new()`, never the on-disk
# `Store::open()`, so this is no functional loss — and it makes cross-compiling
# precompiled gems (esp. Linux x86_64/arm64, incl. musl) reliable and the gems
# much smaller. Re-enable `rocksdb` here if on-disk persistence is ever needed.
oxigraph = { version = "0.5.13", default-features = false }

# NOTE: in-process SHACL is available via the rudof `shacl` crate (>= 0.3.39, crates.io),
# which itself requires oxigraph ^0.5.9 — so staying on 0.5 here means a single shared
# oxigraph copy.

# In-process SHACL validation (rudof project). Uses its own RDF stack internally;
# we cross the boundary only with serialized strings.
shacl = "0.3.39"
rudof_rdf = "0.3.39"
