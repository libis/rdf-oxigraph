name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Ruby 3.2's ruby/internal/stdbool.h only includes <stdbool.h> when
      # HAVE_STDBOOL_H is set; the ubuntu-26.04 toolcache Ruby 3.2 lacks it, so
      # rb-sys' bindgen fails with "unknown type name 'bool'". Force-including it
      # is a no-op everywhere else (Ruby >= 3.3 includes it unconditionally).
      BINDGEN_EXTRA_CLANG_ARGS: "-include stdbool.h"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true

      - name: Compile
        run: bundle exec rake compile

      - name: Minitest
        run: bundle exec rake test

      - name: rdf-spec conformance
        run: bundle exec rake conformance
